- name: Setup Node.js 18
    uses: actions/setup-node@v4
    with:
      node-version: '18'
      cache: 'npm'

  - name: Install dependencies
    # Use `npm ci` if you commit package-lock.json; otherwise `npm install`.
    run: npm install

  - name: Build
    run: npm run build

  - name: Upload build artifact
    uses: actions/upload-artifact@v4
    with:
      name: traverture-build
      path: |
        main.js
        engine_bg.wasm
        engine.js
